name: DIRA CI/CD

# ── Disparadores ──────────────────────────────────────────────────────────────
# El pipeline se activa en dos situaciones:
#   1. Push a main: despliegue automático tras merge de PR
#   2. workflow_dispatch manual: permite forzar un reentrenamiento desde la UI
#      de GitHub Actions o desde drift_check.py (feedback loop automático)
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_training:
        description: 'Forzar lanzamiento del entrenamiento MLRun'
        type: boolean
        default: false

jobs:
  # ── JOB 1: Build & Push ───────────────────────────────────────────────────
  # Construye las cuatro imágenes Docker y las sube a Docker Hub.
  # Corre en el runner self-hosted: tiene Docker disponible y acceso a la red.
  # Las imágenes se etiquetan con el SHA del commit (inmutable) y 'latest' (alias).
  build:
    name: Build & Push Docker Hub
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Cada imagen usa cache de registro (type=registry) para reutilizar capas
      # de la build anterior y reducir el tiempo de construcción.
      - name: Build y push – dira-train
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/train/Dockerfile
          push: true
          # SHA: tag inmutable para rollbacks exactos
          # latest: tag que MLRun usa por defecto cuando no se especifica SHA
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dira-train:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/dira-train:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/dira-train:latest
          cache-to:   type=inline

      - name: Build y push – dira-infer
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/infer/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dira-infer:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/dira-infer:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/dira-infer:latest
          cache-to:   type=inline

      - name: Build y push – dira-front
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/front/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dira-front:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/dira-front:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/dira-front:latest
          cache-to:   type=inline

      - name: Build y push – dira-drift
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/drift/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dira-drift:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/dira-drift:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/dira-drift:latest
          cache-to:   type=inline

  # ── JOB 2: Deploy ─────────────────────────────────────────────────────────
  # Despliega las nuevas imágenes en el clúster k3s.
  # Requiere el runner self-hosted instalado en la misma máquina que k3s,
  # con acceso a kubectl y helm.
  deploy:
    name: Deploy to k3s
    needs: build   # espera a que el job build termine con éxito
    runs-on: self-hosted

    env:
      TRAIN_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/dira-train:${{ github.sha }}
      INFER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/dira-infer:${{ github.sha }}
      FRONT_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/dira-front:${{ github.sha }}
      DRIFT_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/dira-drift:${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # k3s usa containerd, que NO comparte el daemon Docker del host.
      # Las imágenes subidas a Docker Hub deben importarse explícitamente
      # al almacén de imágenes de containerd para que los pods puedan usarlas
      # con imagePullPolicy=IfNotPresent sin necesidad de internet.
      - name: Importar imágenes en k3s
        run: |
          docker pull ${{ env.TRAIN_IMAGE }}
          docker pull ${{ env.INFER_IMAGE }}
          docker pull ${{ env.FRONT_IMAGE }}
          docker pull ${{ env.DRIFT_IMAGE }}
          docker save ${{ env.TRAIN_IMAGE }} | sudo k3s ctr images import -
          docker save ${{ env.INFER_IMAGE }}  | sudo k3s ctr images import -
          docker save ${{ env.FRONT_IMAGE }} | sudo k3s ctr images import -
          docker save ${{ env.DRIFT_IMAGE }} | sudo k3s ctr images import -

      # El CronJob de drift vive en el namespace mlrun (para acceder al model-pvc),
      # pero pertenece al release Helm 'dira'. Si fue creado previamente con
      # kubectl apply (sin metadatos de Helm), el upgrade falla con "cannot be
      # imported into the current release". Este paso lo adopta idempotentemente.
      - name: Adoptar CronJob de drift en Helm (si existe sin metadatos)
        run: |
          if kubectl get cronjob dira-drift-check -n mlrun &>/dev/null; then
            kubectl annotate cronjob dira-drift-check \
              meta.helm.sh/release-name=dira \
              meta.helm.sh/release-namespace=dira \
              -n mlrun --overwrite
            kubectl label cronjob dira-drift-check \
              app.kubernetes.io/managed-by=Helm \
              -n mlrun --overwrite
          fi

      # Actualizar ConfigMap, PVCs y Deployment del frontend.
      # Se pasa la URL del endpoint de inferencia dinámicamente:
      # si el servicio ya existe se lee su NodePort; si no, se omite el parámetro
      # (el valor queda el del values.yaml anterior).
      - name: Helm upgrade – infraestructura DIRA
        run: |
          NODE_IP=$(kubectl get nodes \
            -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
          INFER_PORT=$(kubectl get svc dira-infer -n mlrun \
            -o jsonpath='{.spec.ports[0].nodePort}' 2>/dev/null || echo "")
          INFER_ARGS=""
          if [ -n "$INFER_PORT" ]; then
            INFER_ARGS="--set frontend.apiUrl=http://${NODE_IP}:${INFER_PORT}"
          fi
          helm upgrade --install dira helm/dira \
            --namespace dira \
            --create-namespace \
            --set frontend.image=${{ env.FRONT_IMAGE }} \
            --set monitoring.driftImage=${{ env.DRIFT_IMAGE }} \
            $INFER_ARGS
          # Forzar la recreación del pod del frontend para cargar la nueva imagen
          kubectl rollout restart deployment/dira-front -n dira

      # Detectar si se modificaron ficheros que afectan al comportamiento del modelo.
      # Si no cambiaron, se omiten los pasos de entrenamiento para ahorrar tiempo.
      # En workflow_dispatch con run_training=true se fuerza el entrenamiento
      # independientemente de qué ficheros cambiaron (feedback loop de drift).
      - name: Detectar cambios en código del modelo
        id: model_changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            model:
              - 'src/backend/train.py'
              - 'src/backend/features.py'
              - 'src/backend/data_ingestion.py'
              - 'requirements_train.txt'

      # MLRun SDK se instala en el entorno conda 'dira' (Python 3.9).
      # Se instala en este paso y no en la imagen porque el runner self-hosted
      # es compartido y mlrun==1.10.0 requiere Python < 3.12.
      - name: Instalar SDK MLRun
        if: steps.model_changes.outputs.model == 'true' || github.event.inputs.run_training == 'true'
        run: |
          source /home/angel/.miniconda3/etc/profile.d/conda.sh
          conda activate dira
          pip install --quiet "mlrun==1.10.0"

      # mlrun_project.py lanza el Job de entrenamiento en k3s, espera a que
      # termine y registra métricas y artefactos en el tracking server de MLRun.
      # Al finalizar, reinicia el pod de inferencia para cargar el nuevo modelo.
      - name: Lanzar entrenamiento y serving – MLRun
        if: steps.model_changes.outputs.model == 'true' || github.event.inputs.run_training == 'true'
        env:
          MLRUN_DBPATH: ${{ secrets.MLRUN_DBPATH }}
          TRAIN_IMAGE:  ${{ env.TRAIN_IMAGE }}
          INFER_IMAGE:  ${{ env.INFER_IMAGE }}
        run: |
          source /home/angel/.miniconda3/etc/profile.d/conda.sh
          conda activate dira
          python src/backend/mlrun_project.py

      # Nuclio crea el servicio dira-infer de forma asíncrona después de que
      # mlrun_project.py termine. El servicio puede tardar hasta 2 minutos en
      # aparecer. Se sondea en bucle antes de intentar el health check.
      - name: Health check API de inferencia
        if: steps.model_changes.outputs.model == 'true' || github.event.inputs.run_training == 'true'
        run: |
          NODE=$(kubectl get nodes \
            -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
          # Esperar a que Nuclio publique el servicio (máx. 24 intentos × 5s = 2 min)
          for i in $(seq 1 24); do
            PORT=$(kubectl get svc -n nuclio \
              -l nuclio.io/function-name=dira-infer \
              -o jsonpath='{.items[0].spec.ports[0].nodePort}' 2>/dev/null || echo "")
            [ -n "$PORT" ] && break
            echo "Esperando servicio dira-infer en Nuclio... intento $i/24"
            sleep 5
          done
          if [ -z "$PORT" ]; then
            echo "Error: el servicio dira-infer no apareció en Nuclio tras 2 minutos"
            exit 1
          fi
          # --retry 6 --retry-delay 5: hasta 30 segundos adicionales para que
          # el pod pase de Starting a Ready y cargue el modelo en memoria
          curl --fail --retry 6 --retry-delay 5 \
            "http://${NODE}:${PORT}/v2/health/ready"
