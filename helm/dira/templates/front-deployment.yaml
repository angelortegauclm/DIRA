# ── Deployment del frontend web ───────────────────────────────────────────────
#
# Despliega un pod nginx que sirve la interfaz web estática de DIRA.
# El contenedor sustituye la variable API_URL en config.js al arrancar
# (ver docker/front/40-envsubst.sh), de forma que el navegador del usuario
# sepa a qué dirección enviar las peticiones de inferencia.
#
# Accesible en: http://<node-ip>:30100  (ver front-service.yaml)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dira-front
  namespace: {{ .Release.Namespace }}
  labels:
    app: dira-front
spec:
  # Una sola réplica es suficiente: nginx es stateless y el frontend no tiene
  # estado propio. Escalar solo tendría sentido si hubiera mucho tráfico web.
  replicas: 1
  selector:
    matchLabels:
      app: dira-front
  template:
    metadata:
      labels:
        app: dira-front
    spec:
      containers:
        - name: dira-front
          # Imagen construida desde docker/front/Dockerfile.
          # Contiene nginx + los ficheros estáticos de src/frontend/
          image: {{ .Values.frontend.image }}
          imagePullPolicy: {{ .Values.frontend.imagePullPolicy }}
          ports:
            - containerPort: 80   # Puerto en el que nginx escucha dentro del pod
          env:
            # URL del endpoint de inferencia accesible desde el navegador del usuario.
            # 40-envsubst.sh sustituye ${API_URL} en config.js con este valor al arrancar.
            # Debe ser una dirección alcanzable desde la red del cliente (no una IP interna).
            - name: API_URL
              value: {{ .Values.frontend.apiUrl | quote }}
